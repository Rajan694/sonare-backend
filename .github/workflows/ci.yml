name: CI

on:
  push:
    branches: [main, generic-branch]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - name: Test environment
        run: sed 's#postgres://postgres:yourpassword@#postgres://postgres:postgres@#' .env.test.example > .env.test
      - run: npm test
      - run: npm run build

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the production image (not pushed)
        run: docker build .

  # Telegram message when the run ends (success, failure or cancelled).
  # Reusable workflow + secrets: https://github.com/Rajan694/github-actions
  notify:
    name: Telegram Notification
    if: always()
    needs: [check, docker]
    uses: Rajan694/github-actions/.github/workflows/telegram-notify.yml@v1
    with:
      status: ${{ contains(needs.*.result, 'failure') && 'failure' || contains(needs.*.result, 'cancelled') && 'cancelled' || 'success' }}
      workflow_name: ${{ github.workflow }}
      repository: ${{ github.repository }}
      branch: ${{ github.head_ref || github.ref_name }}
      commit: ${{ github.event.pull_request.head.sha || github.sha }}
      run_url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      actor: ${{ github.actor }}
      is_deployment: false
    secrets:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
